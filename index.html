  /* Explosion graphic */
  #burst { position: absolute; inset: 0; mix-blend-mode: difference; transform-origin: 1528px 665px;
           will-change: transform; visibility: hidden; }
  #burst svg { position: absolute; left: 0; top: 0; overflow: visible; }
  /* Group 2 shards: separate layers above the main graphic */
  #shards { position: absolute; inset: 0; pointer-events: none; }
  .shard { position: absolute; inset: 0; mix-blend-mode: difference; transform-origin: 1528px 665px; will-change: transform; visibility: hidden; }
  .shard svg { position: absolute; overflow: visible; transform-origin: 50% 50%; }

  /* Circles + particles */
  #dots { position: absolute; inset: 0; mix-blend-mode: difference; pointer-events: none; }
  .dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; will-change: transform; }

  /* Typography — positions taken 1:1 from the Figma frame */
  .t { position: absolute; text-transform: uppercase; white-space: nowrap; mix-blend-mode: difference; color: #fff; }
  .medium { font-weight: 500; font-size: 20px; line-height: 1.43; letter-spacing: -0.2px; }
  .title { font-weight: 800; font-size: 125px; line-height: .9; letter-spacing: -7.5px; }
  .line { display: block; overflow: hidden; padding: .06em .1em .02em; margin: -.06em -.1em -.02em; }
  .w { display: inline-block; transform: translate3d(0,115%,0); transition: transform 1s var(--ease-out) var(--d, 0s); }
  .ch { display: inline-block; vertical-align: top; }
  a.btn .ch { clip-path: inset(.33em -1em .33em -1em); }
  #tickets .ch { clip-path: inset(.06em -1em .06em -1em); }
  .in .w { transform: none; }

  /* roll-over buttons */
  a.btn { color: inherit; text-decoration: none; display: inline-block; position: relative; }
  .r { display: block; position: relative; transition: transform .55s var(--ease-io) calc(var(--i) * 16ms); }
  .r > span { display: block; }
  .r > span + span { position: absolute; left: 0; top: 100%; }
  a.btn:hover .r, a.btn:focus-visible .r { transform: translate3d(0,-100%,0); }
  a.btn:focus-visible { outline: none; }

  .nav a.btn { padding-left: 0; transition: padding-left .45s var(--ease-out); }
  .nav a.btn::before { content: ""; position: absolute; left: 0; top: 50%; width: 9px; height: 9px; margin-top: -5px;
                       border-radius: 50%; background: #fff; transform: scale(0); transition: transform .45s var(--ease-out); }
  .nav a.btn:hover, .nav a.btn:focus-visible { padding-left: 18px; }
  .nav a.btn:hover::before, .nav a.btn:focus-visible::before { transform: scale(1); }

  #tickets { font-weight: 800; font-size: 94.161px; line-height: .9; letter-spacing: -5.6497px; }
  #tickets .ul { position: absolute; left: 0; right: 0; bottom: -14px; height: 6px; overflow: hidden; }
  #tickets .ul::before, #tickets .ul::after { content: ""; position: absolute; inset: 0; background: #fff; }
  #tickets .ul::before { transform: scaleX(0); transform-origin: 0 50%; transition: transform 1s var(--ease-out) var(--d, 0s); }
  .in #tickets .ul::before { transform: scaleX(1); }
  #tickets .ul::after { transform: translateX(-101%); transition: transform .0s; }
  .settled #tickets .ul::before { transition: none; }
  #tickets:hover .ul::before { transform: translateX(101%); transition: transform .5s var(--ease-io); }
  #tickets:hover .ul::after { transform: none; transition: transform .5s var(--ease-io) .18s; }

  .tag { font-weight: 800; font-size: 37px; line-height: 1; letter-spacing: -2.22px; }
  .slogan { font-weight: 800; font-size: 47px; line-height: 1; letter-spacing: -2.82px; text-align: right; }

  #flash { position: absolute; inset: 0; background: #fff; mix-blend-mode: difference; opacity: 0; pointer-events: none; }

  #cursor { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
            background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: 10; opacity: 0;
            transition: width .35s var(--ease-out), height .35s var(--ease-out), margin .35s var(--ease-out), opacity .3s; }
  #cursor.big { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  body.has-cursor #cursor { opacity: 1; }

  #hint { border: 0; background: none; cursor: pointer; padding: 6px; position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 500 11px/1 'Inter', sans-serif; letter-spacing: .02em;
          color: #fff; opacity: .5; mix-blend-mode: difference; text-transform: uppercase; z-index: 11; }
  #hint:hover { opacity: 1; }
</style>

  const shardsEl = document.getElementById('shards');
  const prng = (i, k) => { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
  const shards = SHARDS.map((s, i) => {
    const wrap = document.createElement('div'); wrap.className = 'shard';
    wrap.innerHTML = `<svg width="${s.w}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}" style="left:${s.x}px;top:${s.y}px" aria-hidden="true"><path d="${s.d}" fill="white"/></svg>`;
    shardsEl.appendChild(wrap);
    return {
      wrap, svg: wrap.firstChild,
      depth: .35 + prng(i, 1) * .65,          // 0.35 (far) … 1 (close)
      lag: .04 + prng(i, 2) * .16,            // beat phase delay
      amp: 1.5 + prng(i, 3) * 1.4,            // pulse strength vs. main graphic
      delay: .02 + prng(i, 4) * .12,          // intro delay
      fw: .25 + prng(i, 5) * .35, fp: prng(i, 6) * 6.28,   // float speed / phase
      ww: .3 + prng(i, 7) * .5,  wp: prng(i, 8) * 6.28     // local wobble
    };
  });

  /* ---------- timeline ---------- */
  const T0 = 0.9;           // empty textured screen
  const TPRE = 3.2;         // circles appear + spiral in
  const TB = T0 + TPRE;     // moment of collision
  let clock = 0, last = 0, booted = false, introDone = false;
  let mouse = { x: -9999, y: -9999, nx: .5, ny: .5, sx: .5, sy: .5 };
  let beatT = 0.78, beatAmp = 0.028, kick = 0, kickV = 0, beatPhase = 0, rotSpeedBoost = 0;
  const BASE = 1;
  let spin = 0;              // accumulated idle rotation, deg

  function reset() {
    document.body.classList.remove('in', 'ready', 'settled');
    burst.style.visibility = 'hidden';
    shards.forEach(s => { s.wrap.style.visibility = 'hidden'; s.wrap.style.transform = 'scale(0)'; });
    burst.style.clipPath = 'none';
    flash.style.opacity = 0;
    particles.splice(0).forEach(p => p.el.remove());
    makeDots(); introDone = false; booted = false; spin = 0;
    clock = 0; last = performance.now();
    requestAnimationFrame(() => document.body.classList.add('ready'));
  }

  function boom() {
    booted = true;
    burst.style.visibility = 'visible';
    shards.forEach(s => s.wrap.style.visibility = 'visible');
    document.body.classList.add('in');
    setTimeout(() => document.body.classList.add('settled'), 2600);
    dots.forEach(d => { d.x = P.x; d.y = P.y; });
    // after the blast only the smallest original circle remains (+ 2 new small ones)
    dots.filter(d => !d.post).sort((a, b) => b.r - a.r).slice(0, 3).forEach(d => { d.gone = true; d.el.style.display = 'none'; });
  }

  function frame(now) {
    const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
    if (!document.hidden) clock += dt;
    const t = clock;
    mouse.sx = lerp(mouse.sx, mouse.nx, .06); mouse.sy = lerp(mouse.sy, mouse.ny, .06);

    if (!booted && t >= TB) boom();

    if (!booted) {
      /* ---- PRELOADER: 4 circles appear, then spiral clockwise (eased, accelerating) into P ---- */
      dots.forEach(d => {
        const lt = t - T0 - d.born;
        if (d.post || lt < 0) { d.el.style.transform = 'scale(0)'; return; }
        const u = clamp(lt / (TPRE - d.born));
        const ea = Math.pow(u, 2.2);                      // angular speed builds up
        const er = 1 - Math.pow(1 - u, 1.15);             // radius closes in steadily
        const th = d.th0 + d.spins * Math.PI * 2 * ea;
        const R = d.R0 * (1 - er);
        const x = P.x + Math.cos(th) * R;
        const y = P.y + Math.sin(th) * R * .8;
        const vx = (x - d.px) / Math.max(dt, .001), vy = (y - d.py) / Math.max(dt, .001);
        d.px = x; d.py = y;
        const s = easeOutBack(clamp(lt / .6)) * (u > .94 ? lerp(1, .3, (u - .94) / .06) : 1);
        placeDot(d, x, y, Math.max(0, s));
      });
    } else {
      const tb = t - TB;

      /* ---- EXPLOSION graphic ---- */
      // scale: 0 → 1.2 (bigger than original) → 0.95 → 1, then regular beat
      const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
      const introFn = (k, peak) => {
        if (k <= 0) return 0;
        if (k < .5) return peak * easeOutCubic(k / .5);
        if (k < .95) return lerp(peak, .95, easeInOut((k - .5) / .45));
        if (k < 1.35) return lerp(.95, 1, easeOutCubic((k - .95) / .4));
        return 1;
      };
      const introScale = introFn(tb, 1.2);
      // rotation: clockwise sweep in, then continuous clockwise spin
      const introRot = -28 * (1 - easeOutExpo(clamp(tb / 1.3)));
      // idle: rhythmic pulse + slow rotation around own centre
      const idleW = clamp((tb - 1.35) / .5);
      beatPhase += dt / beatT;
      const ph = beatPhase % 1;
      const pulse = beatAmp * Math.min(1, ph / .07) * Math.pow(1 - ph, 3) * idleW;
      // spring for click kicks
      kickV += (-kick * 120 - kickV * 14) * dt; kick += kickV * dt;
      // TICKETS hover: ease smoothly into a faster spin & beat (~1 s ramp in, a bit slower out)
      const hotT = document.body.classList.contains('hot') ? 1 : 0;
      rotSpeedBoost += (hotT - rotSpeedBoost) * (1 - Math.exp(-dt / (hotT ? .9 : 1.3)));
      const hb = rotSpeedBoost * rotSpeedBoost * (3 - 2 * rotSpeedBoost);   // smoothstep
      beatT = lerp(.78, .6, hb); beatAmp = lerp(.028, .036, hb);
      spin += dt * clamp(tb / 1.3) * (3 + hb * 5);   // 3°/s → 8°/s while hovering TICKETS   // ~120 s per turn, faster while TICKETS is hovered
      const rot = introRot + spin;
      const sc = BASE * introScale * (1 + pulse + kick);
      const parX = 0, parY = 0;   // no mouse-driven drift
      burst.style.transform = `translate3d(${parX}px,${parY}px,0) rotate(${rot}deg) scale(${Math.max(0, sc)})`;

      // shards: fly out of the centre with the graphic, then pulse/rotate with it — each a bit differently,
      // with depth-based parallax and a slow float so they read as separate planes in space
      shards.forEach(s => {
        const k = tb - s.delay;
        const intro = introFn(k, 1.2 + .3 * s.depth);
        const sp = ((beatPhase - s.lag) % 1 + 1) % 1;
        const sPulse = beatAmp * s.amp * Math.min(1, sp / .07) * Math.pow(1 - sp, 3) * idleW;
        const fx = Math.sin(tb * s.fw + s.fp) * 14 * s.depth * idleW;
        const fy = Math.cos(tb * s.fw * 1.3 + s.fp) * 10 * s.depth * idleW;
        const px = 0, py = 0;
        const sRot = rot * (1 + (s.depth - .6) * .06) + Math.sin(tb * s.fw * .8 + s.fp) * 2.2 * idleW;
        const sSc = intro * (1 + sPulse + kick * (1 + s.depth * .6));
        s.wrap.style.transform = `translate3d(${px + fx}px,${py + fy}px,0) rotate(${sRot}deg) scale(${Math.max(0, sSc)})`;
        s.svg.style.transform = `rotate(${Math.sin(tb * s.ww + s.wp) * 7 * idleW}deg)`;
      });

      /* ---- flash + camera shake ---- */
      flash.style.opacity = !reduce && tb < .45 ? (1 - tb / .45) * .95 : 0;
      const sh = !reduce && tb < .7 ? 16 * Math.pow(1 - tb / .7, 2) : 0;
      const kickSh = Math.abs(kick) * 50;
      shake.style.transform = (sh + kickSh) > .1 ? `translate3d(${rand(-1,1) * (sh + kickSh)}px,${rand(-1,1) * (sh + kickSh)}px,0)` : '';

      /* ---- circles: fly out of P, then roam freely ---- */
      dots.forEach((d, i) => {
        if (d.gone) return;
        const ft = tb - .05 - d.flyDelay, FLY = 1.5;
        if (ft < FLY) {
          const k = easeOutExpo(clamp(ft / FLY));
          const nx = lerp(P.x, d.hx, k), ny = lerp(P.y, d.hy, k);
          d.vx = (nx - d.x) / Math.max(dt, .001) * .15; d.vy = (ny - d.y) / Math.max(dt, .001) * .15;
          d.x = nx; d.y = ny;
          placeDot(d, d.x, d.y, easeOutBack(clamp(ft / .6)));
          return;
        }
        // wander: heading drifts smoothly, steering + soft bounds + cursor repulsion
        d.a += (Math.sin(t * .37 + i * 1.7) * .6 + Math.sin(t * .91 + i) * .4) * dt * 1.1;
        let ax = Math.cos(d.a) * d.sp - d.vx, ay = Math.sin(d.a) * d.sp - d.vy;
        const m = 140;
        if (d.x < m) ax += (m - d.x) * 1.2; if (d.x > W - m) ax -= (d.x - (W - m)) * 1.2;
        if (d.y < m) ay += (m - d.y) * 1.2; if (d.y > H - m) ay -= (d.y - (H - m)) * 1.2;
        const dx = d.x - mouse.x, dy = d.y - mouse.y, dist = Math.hypot(dx, dy), rad = 170 + d.r;
        if (dist < rad && dist > .1) { const f = (1 - dist / rad) * 2600; ax += dx / dist * f; ay += dy / dist * f; }
        d.vx += ax * dt * .9; d.vy += ay * dt * .9;
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.x < -60 || d.x > W + 60 || d.y < -60 || d.y > H + 60) d.a = Math.atan2(H / 2 - d.y, W / 2 - d.x);
        placeDot(d, d.x, d.y, 1 + pulse * 1.5);
      });
    }

    /* ---- particles ---- */
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life += dt;
      const k = p.life / p.max;
      if (k >= 1) { p.el.remove(); particles.splice(i, 1); continue; }
      p.vx *= Math.pow(.06, dt); p.vy *= Math.pow(.06, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.el.style.transform = `translate3d(${p.x}px,${p.y}px,0) scale(${1 - k})`;
    }

    requestAnimationFrame(frame);
  }

  /* ---------- reduced motion: show final composition ---------- */
  function showStatic() {
    document.body.classList.add('ready', 'in');
    burst.style.visibility = 'visible'; burst.style.clipPath = 'none';
    makeDots();
    dots.forEach(d => placeDot(d, d.hx, d.hy));
  }

  /* ---------- interaction ---------- */
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) / S; mouse.y = (e.clientY - r.top) / S;
    mouse.nx = clamp(mouse.x / W); mouse.ny = clamp(mouse.y / H);
  });
  stage.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

  if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.body.classList.add('has-cursor');
    addEventListener('pointermove', e => { cursor.style.transform = `translate3d(${e.clientX}px,${e.clientY}px,0)`; });
    document.querySelectorAll('a.btn').forEach(a => {
      a.addEventListener('pointerenter', () => cursor.classList.add('big'));
      a.addEventListener('pointerleave', () => cursor.classList.remove('big'));
    });
  }

  // nav: small kick on hover; prevent jump for demo anchors
  document.querySelectorAll('.nav a.btn').forEach(a => {
    a.addEventListener('click', e => e.preventDefault());
  });

  // tickets: faster heartbeat on hover, explosion kick + burst on click, magnetic pull
  const tk = document.getElementById('tickets');
  tk.addEventListener('pointerenter', () => { document.body.classList.add('hot'); });
  tk.addEventListener('pointerleave', () => { document.body.classList.remove('hot'); tk.style.transform = ''; });
  tk.addEventListener('pointermove', e => {
    const r = tk.getBoundingClientRect();
    const mx = (e.clientX - (r.left + r.width / 2)) / S, my = (e.clientY - (r.top + r.height / 2)) / S;
    tk.style.transition = 'transform .25s cubic-bezier(.16,1,.3,1)';
    tk.style.transform = `translate(${mx * .18}px, ${my * .3}px)`;
  });
  tk.addEventListener('click', e => {
    e.preventDefault();
    if (!booted) return;
    kickV += 1.6;
    dots.forEach(d => { const dx = d.x - P.x, dy = d.y - P.y, l = Math.hypot(dx, dy) || 1; d.vx += dx / l * 520; d.vy += dy / l * 520; });
  });

  document.getElementById('hint').addEventListener('click', () => reset());
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') { reset(); } });

  /* ---------- go ---------- */
  const go = () => {
    const run = () => { reset(); requestAnimationFrame(frame); };
    if (document.hidden) document.addEventListener('visibilitychange', function v() { if (!document.hidden) { document.removeEventListener('visibilitychange', v); run(); } });
    else run();
  };
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(go);
})();
</script>
</body>
</html>
